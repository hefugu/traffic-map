name: Compact OSM signal snapshot

on:
  push:
    branches:
      - fix/osm-snapshot-fallback

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact snapshot representation
        run: |
          python - <<'PY'
          import json
          path = 'frontend/public/data/osm-traffic-signals-tokyo.json'
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          if data.get('schemaVersion') == 2:
              print('already compact')
              raise SystemExit(0)
          codes = {'vehicle': 0, 'pedestrian': 1, 'both': 2, 'unknown': 3}
          compact = []
          for signal in data.get('signals', []):
              compact.append([
                  int(signal['id']),
                  float(signal['lat']),
                  float(signal['lng']),
                  codes.get(signal.get('type', 'unknown'), 3),
              ])
          output = {
              'schemaVersion': 2,
              'source': data.get('source'),
              'sourceUrl': data.get('sourceUrl'),
              'osmDataTimestamp': data.get('osmDataTimestamp'),
              'generatedAt': data.get('generatedAt'),
              'bounds': data.get('bounds'),
              'signalCount': len(compact),
              'typeCodes': {'0': 'vehicle', '1': 'pedestrian', '2': 'both', '3': 'unknown'},
              'signals': compact,
          }
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, separators=(',', ':'))
          print('signalCount=', len(compact))
          PY
          ls -lh frontend/public/data/osm-traffic-signals-tokyo.json
      - name: Commit compact snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/public/data/osm-traffic-signals-tokyo.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Compact Tokyo OSM traffic signal snapshot'
            git push
          fi
