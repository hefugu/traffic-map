name: Audit signal blog

on:
  push:
    branches:
      - audit/all-signal-blog-points
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python tools/audit_signal_blog_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: signal-blog-audit
          path: signal-blog-audit/
          if-no-files-found: error
