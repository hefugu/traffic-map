name: Apply navigation label cleanup

on:
  push:
    branches:
      - ui/clearer-navigation-labels

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply UI text cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/App.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "  const [signalErrorMessage, setSignalErrorMessage] = useState<string>('')\n",
              "  const [signalErrorMessage, setSignalErrorMessage] = useState<string>('')\n  const [signalSnapshotDate, setSignalSnapshotDate] = useState<string | null>(null)\n",
          )

          replace_once(
              "    setSignalErrorMessage('')\n    setLoadingRoute(false)\n",
              "    setSignalErrorMessage('')\n    setSignalSnapshotDate(null)\n    setLoadingRoute(false)\n",
          )

          replace_once(
              "    setSignalFetchStatus('loading')\n    setSignalErrorMessage('')\n\n    try {",
              "    setSignalFetchStatus('loading')\n    setSignalErrorMessage('')\n    setSignalSnapshotDate(null)\n\n    try {",
          )

          replace_once(
              "      if (snapshotSignal) {\n        setSignalFetchStatus('snapshot')\n        setSignalErrorMessage(`信号位置はOpenStreetMapの保存データ${snapshotDate ? `（${snapshotDate}時点）` : ''}を使用しています。周期は実測値・地域平均を適用しています。`)\n      } else {\n        setSignalFetchStatus('success')\n        setSignalErrorMessage('')\n      }",
              "      if (snapshotSignal) {\n        setSignalFetchStatus('snapshot')\n        setSignalSnapshotDate(snapshotDate ?? null)\n        setSignalErrorMessage('')\n      } else {\n        setSignalFetchStatus('success')\n        setSignalSnapshotDate(null)\n        setSignalErrorMessage('')\n      }",
          )

          replace_once(
              "      setSignalFetchStatus('error')\n      setSignalErrorMessage('信号情報を取得できなかったため、信号待ちを含まない経路を表示しています。')",
              "      setSignalFetchStatus('error')\n      setSignalSnapshotDate(null)\n      setSignalErrorMessage('信号情報を取得できなかったため、信号待ちを含まない経路を表示しています。')",
          )

          replace_once(
              '<h1 className="app-title">赤信号回避ナビ</h1>',
              '<h1 className="app-title">信号周期ナビ</h1>',
          )

          replace_once(
              "                ? `GPS追跡中${gpsAccuracyMeters !== null ? ` ±${Math.round(gpsAccuracyMeters)}m` : ''}`",
              "                ? `現在地${gpsAccuracyMeters !== null ? ` ±${Math.round(gpsAccuracyMeters)}m` : ''}`",
          )

          replace_once(
              "                {startMode === 'gps' ? 'GPS追跡中' : 'GPS現在地'}",
              "                現在地",
          )

          replace_once(
              "            {loadingRoute ? '候補取得中...' : '信号込みルート'}",
              "            {loadingRoute ? 'ルート検索中...' : 'ルート検索'}",
          )

          replace_once(
              "              <p className=\"detail-note\">実測地点は個別値を優先します。信頼できる地域情報がある場合だけ地域平均を使い、それ以外は「既存実測データ全体平均」と明示して使用します。</p>",
              "              {signalFetchStatus === 'snapshot' && (\n                <p className=\"detail-note\">信号位置はOpenStreetMapの保存データ{signalSnapshotDate ? `（${signalSnapshotDate}時点）` : ''}を使用しています。周期は実測値・地域平均を適用しています。</p>\n              )}\n              <p className=\"detail-note\">実測地点は個別値を優先します。信頼できる地域情報がある場合だけ地域平均を使い、それ以外は「既存実測データ全体平均」と明示して使用します。</p>",
          )

          replace_once(
              "              GPS現在地{gpsAccuracyMeters !== null ? `（精度 ±${Math.round(gpsAccuracyMeters)}m）` : ''}",
              "              現在地{gpsAccuracyMeters !== null ? `（精度 ±${Math.round(gpsAccuracyMeters)}m）` : ''}",
          )

          path.write_text(text, encoding='utf-8')
          PY
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run lint
      - name: Validate visible labels
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('frontend/src/App.tsx').read_text(encoding='utf-8')
          required = ['信号周期ナビ', 'ルート検索', '信号位置はOpenStreetMapの保存データ']
          forbidden = ['赤信号回避ナビ', "'GPS追跡中'", "'GPS現在地'", "'信号込みルート'"]
          for value in required:
              if value not in text:
                  raise SystemExit(f'Missing required UI text: {value}')
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'Old UI text still present: {value}')
          print('UI label validation passed')
          PY
      - name: Commit validated UI changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/App.tsx
          git commit -m 'Simplify navigation labels and move OSM note'
          git push
