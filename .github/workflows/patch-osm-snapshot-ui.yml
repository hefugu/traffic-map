name: Patch and validate OSM snapshot UI

on:
  push:
    branches:
      - fix/osm-snapshot-fallback

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch snapshot source UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "type SignalFetchStatus = 'idle' | 'loading' | 'success' | 'error'",
              "type SignalFetchStatus = 'idle' | 'loading' | 'success' | 'snapshot' | 'error'",
          )

          replace_once(
              "      const fetchedSignals = await fetchTrafficSignalsAroundRoutes(routes, { signal: controller.signal })\n      if (requestId !== signalRequestIdRef.current || controller.signal.aborted) return\n\n      const resolvedSignals: TrafficSignal[] = fetchedSignals.map((signal) => ({",
              "      const fetchedSignals = await fetchTrafficSignalsAroundRoutes(routes, { signal: controller.signal })\n      if (requestId !== signalRequestIdRef.current || controller.signal.aborted) return\n      const snapshotSignal = fetchedSignals.find((signal) => signal.positionSource === 'osm-snapshot')\n      const snapshotDate = snapshotSignal?.snapshotTimestamp?.slice(0, 10)\n\n      const resolvedSignals: TrafficSignal[] = fetchedSignals.map((signal) => ({",
          )

          replace_once(
              "      setSignals(resolvedSignals)\n      setRouteEvaluations(signalAwareEvaluations)\n      setRouteInfo(signalAwareEvaluations[0].route)\n      setSignalFetchStatus('success')",
              "      setSignals(resolvedSignals)\n      setRouteEvaluations(signalAwareEvaluations)\n      setRouteInfo(signalAwareEvaluations[0].route)\n      if (snapshotSignal) {\n        setSignalFetchStatus('snapshot')\n        setSignalErrorMessage(`信号位置はOpenStreetMapの保存データ${snapshotDate ? `（${snapshotDate}時点）` : ''}を使用しています。周期は実測値・地域平均を適用しています。`)\n      } else {\n        setSignalFetchStatus('success')\n        setSignalErrorMessage('')\n      }",
          )

          replace_once(
              "  const signalEvaluationReady = signalFetchStatus === 'success'",
              "  const signalEvaluationReady = signalFetchStatus === 'success' || signalFetchStatus === 'snapshot'",
          )

          replace_once(
              "    : signalFetchStatus === 'success'\n      ? '取得完了'\n      : signalFetchStatus === 'error'",
              "    : signalFetchStatus === 'success'\n      ? '取得完了'\n      : signalFetchStatus === 'snapshot'\n        ? 'OSM保存データ'\n        : signalFetchStatus === 'error'",
          )

          replace_once(
              "                {signalEvaluationReady ? '信号評価済み' : '信号未反映'}",
              "                {signalFetchStatus === 'snapshot' ? 'OSM保存データ' : signalEvaluationReady ? '信号評価済み' : '信号未反映'}",
          )

          replace_once(
              "<div className=\"legend-row legend-row--wide\">ピン：GPS（青）・出発（緑）・目的地（橙）</div>",
              "<div className=\"legend-row legend-row--wide\">ピン：出発（緑）・目的地（橙）</div>",
          )

          path.write_text(text, encoding='utf-8')
          PY
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run lint
      - name: Validate snapshot JSON
        run: |
          node - <<'JS'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('frontend/public/data/osm-traffic-signals-tokyo.json', 'utf8'))
          if (data.schemaVersion !== 2) throw new Error('snapshot schema mismatch')
          if (!Array.isArray(data.signals) || data.signals.length < 1000) throw new Error('snapshot too small')
          if (data.signalCount !== data.signals.length) throw new Error('snapshot count mismatch')
          console.log({ signalCount: data.signalCount, osmDataTimestamp: data.osmDataTimestamp })
          JS
      - name: Commit validated app changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/App.tsx
          if git diff --cached --quiet; then
            echo 'No app changes.'
          else
            git commit -m 'Show OSM snapshot signal source'
            git push
          fi
