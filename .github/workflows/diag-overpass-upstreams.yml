name: Diagnose OSM signal fallback

on:
  push:
    branches:
      - diag/overpass-upstreams

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ohsome latest traffic signals
        shell: bash
        run: |
          set -u
          rm -f /tmp/ohsome.json
          CODE=$(curl -sS --max-time 30 --compressed -o /tmp/ohsome.json -w '%{http_code}' \
            -X POST 'https://api.ohsome.org/v1/elements/geometry' \
            -H 'Accept: application/geo+json, application/json' \
            -H 'User-Agent: traffic-map/1.0 (https://traffic-map-delta.vercel.app)' \
            --data-urlencode 'bboxes=139.80,35.695,139.82,35.70' \
            --data-urlencode 'filter=type:node and (highway=traffic_signals or crossing=traffic_signals)' \
            --data-urlencode 'properties=tags,metadata' \
            --data-urlencode 'clipGeometry=false' || true)
          echo "status=$CODE"
          python - <<'PY'
          import json
          p='/tmp/ohsome.json'
          try:
              with open(p, encoding='utf-8') as f:
                  data=json.load(f)
              print('type=', data.get('type'))
              print('features=', len(data.get('features', [])))
              print('metadata=', data.get('metadata', {}))
              for feature in data.get('features', [])[:3]:
                  print(feature)
          except Exception as e:
              print('parse_error=', repr(e))
              try:
                  print(open(p, encoding='utf-8', errors='replace').read()[:1000])
              except Exception:
                  pass
          PY
