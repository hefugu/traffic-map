name: Generate OSM signal snapshot

on:
  push:
    branches:
      - fix/osm-snapshot-fallback

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
      - name: Download current Kanto OSM extract
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/kanto.osm.pbf \
            https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf
          osmium fileinfo /tmp/kanto.osm.pbf
      - name: Extract Tokyo-area traffic signal nodes
        run: |
          osmium tags-filter /tmp/kanto.osm.pbf \
            n/highway=traffic_signals \
            n/crossing=traffic_signals \
            -o /tmp/signals.osm --overwrite
          mkdir -p frontend/public/data
          python - <<'PY'
          import datetime
          import json
          import subprocess
          import xml.etree.ElementTree as ET

          # Covers all Tokyo 23 wards with a small buffer into neighboring municipalities.
          WEST, SOUTH, EAST, NORTH = 139.45, 35.45, 140.05, 35.90
          source_url = 'https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf'
          try:
              osm_timestamp = subprocess.check_output(
                  ['osmium', 'fileinfo', '-e', '-g', 'data.timestamp.last', '/tmp/kanto.osm.pbf'],
                  text=True,
              ).strip()
          except Exception:
              osm_timestamp = ''

          signals = []
          for _event, elem in ET.iterparse('/tmp/signals.osm', events=('end',)):
              # Do not clear child <tag> elements before their parent <node> is handled.
              if elem.tag != 'node':
                  continue
              try:
                  node_id = int(elem.attrib['id'])
                  lat = float(elem.attrib['lat'])
                  lng = float(elem.attrib['lon'])
              except (KeyError, ValueError):
                  elem.clear()
                  continue
              if not (SOUTH <= lat <= NORTH and WEST <= lng <= EAST):
                  elem.clear()
                  continue
              tags = {tag.attrib.get('k', ''): tag.attrib.get('v', '') for tag in elem.findall('tag')}
              vehicle = tags.get('highway') == 'traffic_signals'
              pedestrian = tags.get('crossing') == 'traffic_signals'
              if vehicle and pedestrian:
                  signal_type = 'both'
                  source = 'highway=traffic_signals + crossing=traffic_signals'
              elif pedestrian:
                  signal_type = 'pedestrian'
                  source = 'crossing=traffic_signals'
              elif vehicle:
                  signal_type = 'vehicle'
                  source = 'highway=traffic_signals'
              else:
                  elem.clear()
                  continue
              signals.append({
                  'id': node_id,
                  'lat': round(lat, 7),
                  'lng': round(lng, 7),
                  'type': signal_type,
                  'source': source,
              })
              elem.clear()

          signals.sort(key=lambda item: item['id'])
          payload = {
              'schemaVersion': 1,
              'source': 'OpenStreetMap via Geofabrik Kanto extract',
              'sourceUrl': source_url,
              'osmDataTimestamp': osm_timestamp or None,
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'bounds': {'west': WEST, 'south': SOUTH, 'east': EAST, 'north': NORTH},
              'signalCount': len(signals),
              'signals': signals,
          }
          path = 'frontend/public/data/osm-traffic-signals-tokyo.json'
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, separators=(',', ':'))
          print(f'wrote {len(signals)} signal nodes to {path}')
          print(f'OSM timestamp: {osm_timestamp}')
          if len(signals) < 1000:
              raise SystemExit(f'Unexpectedly small signal snapshot: {len(signals)} nodes')
          PY
          ls -lh frontend/public/data/osm-traffic-signals-tokyo.json
      - name: Commit generated snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/public/data/osm-traffic-signals-tokyo.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged.'
          else
            git commit -m 'Add Tokyo OSM traffic signal snapshot'
            git push
          fi
